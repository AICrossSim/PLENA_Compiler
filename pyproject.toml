[project]
name = "plena-compiler"
version = "0.1.0"
description = "PLENA assembly compiler and code generation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[tool.pytest.ini_options]
markers = [
    "slow: long-running test, deselected in CI via -m 'not slow'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "compiler",
    "assembler",
    "asm_templates",
    "aten",
    "generator",
    "utils",
]
